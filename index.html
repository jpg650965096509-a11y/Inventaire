<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Inventaire">
<title>Inventaire pièces</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--card:#FFFFFF;--ink:#14213D;--mute:#5B6678;--line:#D5DBE5;
  --head:#14213D;--headtxt:#FFFFFF;--acc:#FFC300;--accink:#14213D;--bad:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1426;--card:#18223B;--ink:#EEF1F8;--mute:#9AA6BF;--line:#2B3858;
    --head:#0A1022;--headtxt:#FFFFFF;--bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1426;--card:#18223B;--ink:#EEF1F8;--mute:#9AA6BF;--line:#2B3858;
  --head:#0A1022;--headtxt:#FFFFFF;--bad:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:var(--headtxt);padding:16px}
header h1{margin:0;font:700 30px/1.1 "Barlow Condensed",Barlow,system-ui,sans-serif;letter-spacing:.2px}
#count{margin:4px 0 0;color:var(--acc);font-weight:600}
#hv{font:600 14px Barlow,system-ui,sans-serif;color:var(--acc);margin-left:6px;letter-spacing:0}
main{max-width:640px;margin:0 auto;padding:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  background:var(--card);color:var(--ink);font:600 16px Barlow,system-ui,sans-serif;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.danger{color:var(--bad)}
.btn.big{width:100%;font-size:18px;min-height:52px}
button:focus-visible,input:focus-visible,a:focus-visible,label.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  background:var(--bg);color:var(--ink);font:16px Barlow,system-ui,sans-serif}
label{display:block;font-weight:600;margin-bottom:10px}
label input{margin-top:4px;font-weight:400}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
#reader{margin-top:10px;border-radius:10px;overflow:hidden;min-height:1px}
.opts{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.opts .step{flex:0 0 110px}
.opts label{margin:0}
#list{list-style:none;margin:0;padding:0}
#list li{display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.info{min-width:0;flex:1}
.info b{display:block;font-size:17px;overflow-wrap:anywhere}
.info small{display:block;color:var(--mute);overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:48px;text-align:center;font:700 28px/1 "Barlow Condensed",Barlow,system-ui,sans-serif}
.qty button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font:700 22px Barlow,system-ui,sans-serif;cursor:pointer}
li.empty{display:block;text-align:center;color:var(--mute);cursor:default;border-style:dashed}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools>*{flex:1 1 140px;text-align:center}
.tools input[type=file]{display:none}
dialog{width:min(92vw,460px);border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,34,.6)}
dialog h2{margin:0 0 12px;font:700 24px "Barlow Condensed",Barlow,system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--head);color:var(--headtxt);padding:10px 16px;border-radius:999px;font-weight:600;
  max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#sync{min-height:36px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:999px;padding:4px 12px;font:600 14px Barlow,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
#sync.off{color:#FFB4A9;border-color:#FFB4A9}
.snap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.snap small{display:block;color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:0 0 10px}
dialog .row{margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div><h1>Inventaire pièces <small id="hv"></small></h1><p id="count">0 référence</p></div>
  <button id="sync" type="button">Synchro : non</button>
</header>

<main>
  <section class="panel" aria-label="Scanner">
    <button class="btn pri big" id="scanBtn" type="button">Scanner</button>
    <div id="reader"></div>
    <p class="hint" id="rd" style="margin:6px 0 0"></p>
    <label style="display:flex;gap:8px;align-items:center;margin:8px 0 0;font-weight:400"><input type="checkbox" id="pm" style="width:auto;min-height:0;margin:0"> Mode précis (plus lent)</label>
    <div class="opts">
      <label class="step">Quantité par scan<input id="step" type="text" inputmode="decimal" value="1"></label>
      <label style="flex:1">Code saisi ou lecteur Bluetooth<input id="manual" type="text" autocomplete="off" enterkeyhint="done"></label>
      <button class="btn" id="manualBtn" type="button">OK</button>
    </div>
  </section>

  <input id="search" type="search" placeholder="Rechercher une pièce, un code, un emplacement" aria-label="Rechercher" style="margin-bottom:12px">
  <ul id="list"></ul>

  <section class="panel tools" aria-label="Données">
    <button class="btn" id="addBtn" type="button">Ajouter à la main</button>
    <button class="btn" id="expBtn" type="button">Export CSV</button>
    <label class="btn" style="margin:0">Import CSV<input id="imp" type="file" accept=".csv,text/csv,text/plain"></label>
    <button class="btn" id="bakBtn" type="button">Sauvegardes</button>
    <button class="btn danger" id="clrBtn" type="button">Tout effacer</button>
  </section>
  <p class="hint" id="ver" style="text-align:center"></p>
</main>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Fiche pièce</h2>
    <label>Code-barres<input id="fc" required autocomplete="off"></label>
    <label>Nom<input id="fn" required autocomplete="off"></label>
    <label>Quantité<input id="fq" inputmode="decimal" value="0"></label>
    <label>Emplacement<input id="fl" autocomplete="off"></label>
    <label>Note<input id="fo" autocomplete="off"></label>
    <div class="row">
      <button type="button" class="btn danger" id="fd">Supprimer</button>
      <button type="button" class="btn" id="fx">Annuler</button>
      <button type="submit" class="btn pri">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="sdlg">
  <h2>Synchronisation</h2>
  <p class="hint">Utilise la même adresse et le même code sur chaque téléphone.</p>
  <label>Adresse Firebase<input id="su" placeholder="https://xxx-default-rtdb.europe-west1.firebasedatabase.app" autocomplete="off"></label>
  <label>Code d'inventaire<input id="sr" autocomplete="off"></label>
  <div class="row"><button class="btn" id="sg" type="button">Générer un code</button><button class="btn pri" id="ss" type="button">Connecter</button></div>
  <div class="row"><button class="btn danger" id="sd" type="button">Déconnecter</button><button class="btn" id="sx" type="button">Fermer</button></div>
  <p class="hint" id="who" style="margin-top:12px"></p>
  <div class="row"><button class="btn" id="lo" type="button">Compte</button></div>
</dialog>

<dialog id="ldlg">
  <form id="lf">
    <h2>Connexion</h2>
    <p class="hint">Compte fourni par l'administrateur.</p>
    <label>E-mail<input id="le" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
    <div class="row">
      <button type="button" class="btn" id="lr">Mot de passe oublié</button>
      <button type="button" class="btn" id="lx">Fermer</button>
      <button type="submit" class="btn pri">Se connecter</button>
    </div>
  </form>
</dialog>

<dialog id="bdlg">
  <h2>Sauvegardes</h2>
  <div id="snaps"></div>
  <div class="row"><button class="btn pri" id="bn" type="button">Sauvegarder maintenant</button><button class="btn" id="bj" type="button">Télécharger JSON</button></div>
  <div class="row"><label class="btn" style="margin:0">Restaurer un JSON<input id="bi" type="file" accept=".json,application/json" style="display:none"></label><button class="btn" id="bx" type="button">Fermer</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var KEY='inventaire_pieces_v1',KS='inventaire_snaps_v1',KC='inventaire_sync_v1',KD='inventaire_dirty_v1',KA='inventaire_auth_v1',VERSION='1.4';
  var API_KEY='AIzaSyCOWaxk1eDY0eAcNirZcIsKyOadhUVsfQs';
  var $=function(id){return document.getElementById(id)};
  function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Stockage local plein ou indisponible')}}
  var items=ld(KEY,[]),snaps=ld(KS,[]),cfg=ld(KC,null),dirty=ld(KD,[]),auth=ld(KA,null);
  if(!auth||!auth.refresh||!auth.email)auth=null;
  var op=auth?auth.email:'';
  var editing=null,scanner=null,lastCode='',lastTime=0,tt,st,syncing=false,lastOk=0,failed=false;
  if(!Array.isArray(items))items=[];if(!Array.isArray(snaps))snaps=[];if(!Array.isArray(dirty))dirty=[];
  items.forEach(function(i){if(!i.t)i.t=Date.now()});

  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:Math.round(n*1000)/1000}
  function fmt(n){return n.toLocaleString('fr-BE',{maximumFractionDigits:3})}
  function day(){return new Date().toISOString().slice(0,10)}
  function strip(i){return{code:i.code,name:i.name,qty:i.qty,loc:i.loc,note:i.note}}
  function download(txt,type,name){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

  /* Données : les suppressions restent en "pierre tombale" (del:true) pour se propager aux autres téléphones */
  function live(){return items.filter(function(i){return !i.del})}
  function idx(c){for(var i=0;i<items.length;i++)if(items[i].code===c)return i;return -1}
  function find(c){var k=idx(c);return k>-1&&!items[k].del?items[k]:null}
  function put(it){it.t=Date.now();it.by=op;var k=idx(it.code);if(k>-1)items[k]=it;else items.push(it);if(dirty.indexOf(it.code)<0)dirty.push(it.code)}
  function tomb(c){put({code:c,del:true})}
  function commit(){sv(KEY,items);sv(KD,dirty);render();status();later()}

  /* Sauvegardes locales */
  function svq(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  function snap(why){
    var l=live();if(!l.length)return;
    snaps.unshift({t:Date.now(),why:why,items:l.map(function(i){return[i.code,i.name,i.qty,i.loc,i.note]})});
    snaps=snaps.slice(0,3);
    while(snaps.length&&!svq(KS,snaps))snaps.pop();
    if(!snaps.length)toast('Sauvegarde locale impossible : espace plein');
  }
  function restore(list){
    snap('avant restauration');var keep={};
    list.forEach(function(x){
      if(!x||x.code==null||x.code==='')return;var c=String(x.code);keep[c]=1;
      put({code:c,name:String(x.name||c),qty:num(x.qty),loc:String(x.loc||''),note:String(x.note||'')});
    });
    live().forEach(function(i){if(!keep[i.code])tomb(i.code)});
    commit();toast('Données restaurées');
  }
  function snapList(){
    $('snaps').innerHTML=snaps.length?snaps.map(function(s,n){
      return '<div class="snap"><div><b>'+new Date(s.t).toLocaleString('fr-BE',{dateStyle:'short',timeStyle:'short'})+'</b><small>'+esc(s.why)+', '+s.items.length+' réf.</small></div><button class="btn" data-r="'+n+'" type="button">Restaurer</button></div>';
    }).join(''):'<p class="hint">Aucune sauvegarde pour le moment.</p>';
  }

  /* Synchronisation (Firebase Realtime Database, API REST, la modification la plus récente gagne par pièce) */
  function base(q,tok){var u=cfg.url.replace(/\/+$/,'')+'/inventaires/'+encodeURIComponent(cfg.room)+'/items.json'+(q||'');return u+(q?'&':'?')+'auth='+encodeURIComponent(tok)}
  function key(c){return encodeURIComponent(c).replace(/\./g,'%2E')}

  /* Connexion e-mail + mot de passe (API REST Firebase Authentication, sans SDK) */
  function idt(path,body){
    return fetch('https://identitytoolkit.googleapis.com/v1/'+path+'?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j})});
  }
  function saveAuth(j){
    var email=j.email||(auth&&auth.email);
    auth={email:email,refresh:j.refreshToken||j.refresh_token,token:j.idToken||j.id_token,exp:Date.now()+(parseInt(j.expiresIn||j.expires_in,10)||3600)*1000};
    sv(KA,auth);op=email;
  }
  function logout(){auth=null;try{localStorage.removeItem(KA)}catch(e){}op=''}
  function token(){
    if(!auth)return Promise.reject(new Error('noauth'));
    if(auth.exp-Date.now()>60000)return Promise.resolve(auth.token);
    return fetch('https://securetoken.googleapis.com/v1/token?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refresh)})
      .then(function(r){return r.json().then(function(j){
        if(!r.ok){
          var m=(j.error&&j.error.message)||'';
          if(/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN|CREDENTIAL_TOO_OLD/.test(m)){logout();toast('Session expirée : reconnecte-toi')}
          throw new Error(auth?m||r.status:'noauth');
        }
        saveAuth(j);return auth.token;
      })});
  }
  function req(m,b,q){
    return token().then(function(tok){
      var ac=new AbortController(),to=setTimeout(function(){ac.abort()},15000);
      return fetch(base(q,tok),{method:m,body:b?JSON.stringify(b):undefined,signal:ac.signal}).then(function(r){
        clearTimeout(to);if(!r.ok)throw new Error(r.status);return r.json();
      });
    });
  }
  /* Téléchargement complet à la connexion puis une fois par jour ; sinon seulement les changements récents (champ s = heure d'envoi) */
  function sync(){
    if(!cfg||syncing||!navigator.onLine)return;
    if(!auth){status();return}
    syncing=true;status();var t0=Date.now();
    var full=!cfg.full||t0-cfg.full>864e5;
    var q=full?'':'?orderBy=%22s%22&startAt='+Math.max(0,(cfg.since||0)-3e5);
    req('GET',null,q).then(function(rm){
      rm=rm||{};var changed=false;
      Object.keys(rm).forEach(function(k){
        var r=rm[k];if(!r||!r.code)return;var i=idx(r.code);
        if(i<0){items.push(r);changed=true}else if(r.t>items[i].t){items[i]=r;changed=true}
      });
      var up={},sent={},n=0;
      dirty.forEach(function(c){
        var i=idx(c);if(i<0)return;
        var o={};for(var f in items[i])o[f]=items[i][f];o.s=t0;
        up[key(c)]=o;sent[c]=items[i].t;n++;
      });
      return (n?req('PATCH',up):Promise.resolve()).then(function(){
        dirty=dirty.filter(function(c){var i=idx(c);return i>-1&&(sent[c]===undefined||items[i].t!==sent[c])});
        cfg.since=t0;if(full)cfg.full=t0;sv(KC,cfg);
        lastOk=Date.now();failed=false;sv(KEY,items);sv(KD,dirty);if(changed)render();
      });
    }).catch(function(e){
      var m=e&&e.message;failed=true;
      if(m==='400')toast('Règles Firebase à mettre à jour (index sur s)');
      else if(m==='401'||m==='403')toast('Accès refusé : compte non autorisé');
      else if(m==='noauth')failed=false;
    }).then(function(){syncing=false;status()});
  }
  function later(){clearTimeout(st);st=setTimeout(sync,1200)}
  function status(){
    var b=$('sync'),n=dirty.length,off=!navigator.onLine;
    b.className=(off||failed)?'off':'';
    if(!cfg)b.textContent=off?'Hors ligne':'Synchro : non';
    else if(!auth){b.className='off';b.textContent='Connexion requise'}
    else if(off||failed)b.textContent='Hors ligne'+(n?', '+n+' en attente':'');
    else if(syncing&&(n||!lastOk))b.textContent='Synchronisation…';
    else if(!lastOk)b.textContent='En attente de synchro';
    else b.textContent='Synchronisé '+new Date(lastOk).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
  }

  function render(){
    var q=$('search').value.trim().toLowerCase();
    var all=live();
    var list=all.filter(function(i){return !q||[i.code,i.name,i.loc,i.note].join(' ').toLowerCase().indexOf(q)>-1})
      .sort(function(a,b){return String(a.name).localeCompare(String(b.name),'fr')});
    $('list').innerHTML=list.length?list.slice(0,200).map(function(i){
      return '<li data-c="'+esc(i.code)+'"><div class="info"><b>'+esc(i.name)+'</b><small>'+esc(i.code)+'</small>'+
        (i.loc?'<small>Emplacement : '+esc(i.loc)+'</small>':'')+
        (i.by?'<small>Modifié par '+esc(String(i.by).split('@')[0])+', '+new Date(i.t).toLocaleString('fr-BE',{dateStyle:'short',timeStyle:'short'})+'</small>':'')+
        '</div><div class="qty"><button type="button" data-d="-1" aria-label="Retirer">−</button><span>'+fmt(i.qty)+
        '</span><button type="button" data-d="1" aria-label="Ajouter">+</button></div></li>';
    }).join('')+(list.length>200?'<li class="empty">'+(list.length-200)+' autres pièces : affine la recherche.</li>':''):'<li class="empty">'+(all.length?'Aucune pièce ne correspond.':'Aucune pièce. Appuie sur Scanner pour commencer.')+'</li>';
    var total=all.reduce(function(s,i){return s+i.qty},0);
    $('count').textContent=all.length+(all.length>1?' références, ':' référence, ')+fmt(total)+(total>1?' pièces':' pièce');
  }

  function openForm(it){
    editing=it&&find(it.code)?it.code:null;
    $('dt').textContent=editing?'Modifier la pièce':'Nouvelle pièce';
    $('fc').value=it?it.code:'';$('fn').value=it&&it.name?it.name:'';
    $('fq').value=it&&it.qty!==undefined?String(it.qty).replace('.',','):String($('step').value||'1');
    $('fl').value=it&&it.loc?it.loc:'';$('fo').value=it&&it.note?it.note:'';
    $('fd').style.display=editing?'':'none';
    if(!$('dlg').open)$('dlg').showModal();
    setTimeout(function(){(it&&it.code?$('fn'):$('fc')).focus()},50);
  }

  function handleCode(code){
    code=String(code).trim();if(!code)return;
    var it=find(code);
    if(it){it.qty=num(it.qty+num($('step').value||1));put(it);commit();toast(it.name+' : '+fmt(it.qty))}
    else{stopScan();openForm({code:code,qty:num($('step').value||1)})}
  }

  /* Anti fausses lectures : clé de contrôle EAN/UPC + deux lectures identiques de suite */
  var cand='',candN=0,candT=0,badT=0;
  function eanOk(s){
    var n=s.length,sum=0,i;
    for(i=0;i<n-1;i++)sum+=((n-1-i)%2===1)?Number(s[i])*3:Number(s[i]);
    return (10-sum%10)%10===Number(s[n-1]);
  }
  var precis=ld('inventaire_precis_v1',false)===true;
  function onScan(text,res){
    var now=Date.now();
    if(text===lastCode&&now-lastTime<2000)return;
    var fmt=res&&res.result&&res.result.format&&res.result.format.formatName;
    var ean=(fmt==='EAN_13'||fmt==='EAN_8'||fmt==='UPC_A');
    if(ean&&(!/^\d+$/.test(text)||!eanOk(text))){$('rd').textContent='Rejeté (clé invalide) : '+text;return}
    var need=precis?3:(ean?1:2);
    if(text!==cand||now-candT>1500){cand=text;candN=0}
    candN++;candT=now;
    $('rd').textContent='Lu : '+text+' ('+(fmt||'?')+')'+(need>1?' '+candN+'/'+need:'');
    if(candN<need)return;
    cand='';candN=0;
    lastCode=text;lastTime=now;
    if(navigator.vibrate)navigator.vibrate(60);
    handleCode(text);
  }
  function startScan(){
    if(!window.Html5Qrcode){toast('Scanner indisponible : bibliothèque non chargée');return}
    if(scanner)return;
    var F=window.Html5QrcodeSupportedFormats||{};
    var fmts=['EAN_13','EAN_8','UPC_A','UPC_E','CODE_128','CODE_39','CODE_93','ITF','CODABAR','RSS_14'].map(function(n){return F[n]}).filter(function(v){return v!==undefined});
    var conf={verbose:false};
    if(precis)conf.experimentalFeatures={useBarCodeDetectorIfSupported:true};
    if(fmts.length)conf.formatsToSupport=fmts;
    scanner=new Html5Qrcode('reader',conf);
    var sconf=precis?{
      fps:10,
      qrbox:function(w,h){return{width:Math.floor(w*0.9),height:Math.floor(Math.min(h*0.5,220))}},
      videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}
    }:{fps:10,qrbox:{width:260,height:150}};
    scanner.start({facingMode:'environment'},sconf,onScan,function(){})
      .then(function(){$('scanBtn').textContent='Arrêter le scan'})
      .catch(function(err){toast('Erreur caméra : '+err);scanner=null;$('reader').innerHTML=''});
  }
  function stopScan(){
    var s=scanner;scanner=null;$('scanBtn').textContent='Scanner';
    if(!s)return;
    s.stop().then(function(){s.clear()}).catch(function(){try{s.clear()}catch(e){}});
  }

  function csvQuote(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
  function exportCSV(){
    var l=live();if(!l.length){toast('Rien à exporter');return}
    var rows=[['Code','Nom','Quantité','Emplacement','Note']].concat(l.map(function(i){
      return [i.code,i.name,String(i.qty).replace('.',','),i.loc,i.note];
    }));
    download('﻿'+rows.map(function(r){return r.map(csvQuote).join(';')}).join('\r\n'),'text/csv','inventaire-'+day()+'.csv');
    toast('CSV exporté');
  }
  function parseCSV(t){
    t=t.replace(/^﻿/,'');
    var first=t.split(/\r?\n/)[0]||'';
    var d=first.split(';').length>=first.split(',').length?';':',';
    var rows=[],r=[],f='',q=false,i,c;
    for(i=0;i<t.length;i++){
      c=t[i];
      if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
      else if(c==='"')q=true;
      else if(c===d){r.push(f);f=''}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}
      else f+=c;
    }
    if(f!==''||r.length){r.push(f);rows.push(r)}
    return rows.filter(function(x){return x.some(function(v){return v.trim()})});
  }
  function importCSV(file){
    var rd=new FileReader();
    rd.onload=function(){
      var rows=parseCSV(String(rd.result));
      if(rows.length&&/^code/i.test(rows[0][0].trim()))rows.shift();
      snap('avant import CSV');
      var added=0,updated=0;
      rows.forEach(function(r){
        var code=(r[0]||'').trim();if(!code)return;
        if(find(code))updated++;else added++;
        put({code:code,name:(r[1]||'').trim()||code,qty:num(r[2]||0),loc:(r[3]||'').trim(),note:(r[4]||'').trim()});
      });
      commit();toast(added+' ajoutée(s), '+updated+' mise(s) à jour');
    };
    rd.readAsText(file,'utf-8');
  }

  /* Événements */
  $('scanBtn').onclick=function(){scanner?stopScan():startScan()};
  $('pm').checked=precis;
  $('pm').onchange=function(){
    precis=$('pm').checked;sv('inventaire_precis_v1',precis);
    if(scanner){var s=scanner;scanner=null;s.stop().then(function(){s.clear();startScan()}).catch(function(){})}
    toast(precis?'Mode précis':'Mode rapide');
  };
  $('manualBtn').onclick=function(){handleCode($('manual').value);$('manual').value='';$('manual').focus()};
  $('manual').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();$('manualBtn').click()}};
  $('search').oninput=render;
  $('addBtn').onclick=function(){openForm(null)};
  $('expBtn').onclick=exportCSV;
  $('imp').onchange=function(e){if(e.target.files[0])importCSV(e.target.files[0]);e.target.value=''};
  $('clrBtn').onclick=function(){
    if(live().length&&confirm('Effacer toutes les pièces (sur tous les téléphones synchronisés) ? Une sauvegarde est créée avant.')){
      snap('avant effacement');live().forEach(function(i){tomb(i.code)});commit();toast('Inventaire vidé');
    }
  };
  $('list').onclick=function(e){
    var li=e.target.closest('li[data-c]');if(!li)return;
    var it=find(li.getAttribute('data-c'));if(!it)return;
    var b=e.target.closest('button[data-d]');
    if(b){it.qty=Math.max(0,num(it.qty+Number(b.getAttribute('data-d'))*num($('step').value||1)));put(it);commit()}
    else openForm(it);
  };
  $('fx').onclick=function(){$('dlg').close()};
  $('fd').onclick=function(){
    if(editing&&confirm('Supprimer cette pièce ?')){tomb(editing);commit();$('dlg').close();toast('Pièce supprimée')}
  };
  $('f').onsubmit=function(e){
    e.preventDefault();
    var code=$('fc').value.trim(),name=$('fn').value.trim();
    if(!code||!name)return;
    if(find(code)&&code!==editing){toast('Ce code existe déjà');return}
    if(editing&&code!==editing)tomb(editing);
    put({code:code,name:name,qty:num($('fq').value),loc:$('fl').value.trim(),note:$('fo').value.trim()});
    commit();$('dlg').close();toast('Enregistré');
  };

  function openLogin(){$('le').value=auth?auth.email:($('le').value||'');$('lp').value='';if(!$('ldlg').open)$('ldlg').showModal()}
  function who(){$('who').textContent=auth?'Connecté : '+auth.email:'Non connecté';$('lo').textContent=auth?'Se déconnecter du compte':'Se connecter'}
  $('sync').onclick=function(){
    if(cfg&&!auth){openLogin();return}
    $('su').value=cfg?cfg.url:'';$('sr').value=cfg?cfg.room:'';who();$('sdlg').showModal();
  };
  $('lo').onclick=function(){
    if(auth){logout();$('sdlg').close();status();toast('Déconnecté du compte')}
    else{$('sdlg').close();openLogin()}
  };
  $('lx').onclick=function(){$('ldlg').close()};
  $('lf').onsubmit=function(e){
    e.preventDefault();
    var em=$('le').value.trim(),pw=$('lp').value;if(!em||!pw)return;
    idt('accounts:signInWithPassword',{email:em,password:pw,returnSecureToken:true}).then(function(j){
      saveAuth(j);$('lp').value='';$('ldlg').close();failed=false;lastOk=0;status();sync();toast('Connecté : '+auth.email);
    }).catch(function(err){
      var m=(err&&err.message)||'';
      toast(/INVALID|EMAIL_NOT_FOUND|PASSWORD/.test(m)?'E-mail ou mot de passe incorrect':/TOO_MANY/.test(m)?'Trop d\'essais, réessaie plus tard':'Connexion impossible (réseau ?)');
    });
  };
  $('lr').onclick=function(){
    var em=$('le').value.trim();if(!em){toast("Saisis d'abord ton e-mail");return}
    idt('accounts:sendOobCode',{requestType:'PASSWORD_RESET',email:em}).then(function(){toast('E-mail de réinitialisation envoyé')}).catch(function(){toast('Envoi impossible')});
  };
  $('sg').onclick=function(){
    var a=new Uint8Array(9);crypto.getRandomValues(a);
    $('sr').value=Array.prototype.map.call(a,function(x){return x.toString(36).padStart(2,'0')}).join('').slice(0,14);
  };
  $('ss').onclick=function(){
    var u=$('su').value.trim(),r=$('sr').value.trim();
    if(!/^https:\/\/.+/.test(u)||r.length<6){toast('Adresse en https et code de 6 caractères minimum');return}
    snap('avant synchro');cfg={url:u,room:r};sv(KC,cfg);dirty=items.map(function(i){return i.code});sv(KD,dirty);failed=false;lastOk=0;
    $('sdlg').close();status();
    if(auth)sync();else openLogin();
  };
  $('sd').onclick=function(){cfg=null;try{localStorage.removeItem(KC)}catch(e){}$('sdlg').close();status();toast('Synchronisation désactivée')};
  $('sx').onclick=function(){$('sdlg').close()};

  $('bakBtn').onclick=function(){snapList();$('bdlg').showModal()};
  $('snaps').onclick=function(e){
    var b=e.target.closest('button[data-r]');
    if(b&&confirm("Remplacer l'inventaire actuel par cette sauvegarde ?")){restore(snaps[+b.getAttribute('data-r')].items.map(function(r){return Array.isArray(r)?{code:r[0],name:r[1],qty:r[2],loc:r[3],note:r[4]}:r}));$('bdlg').close()}
  };
  $('bn').onclick=function(){snap('manuelle');snapList();toast('Sauvegarde créée')};
  $('bj').onclick=function(){
    download(JSON.stringify({app:'inventaire-pieces',version:2,exported:new Date().toISOString(),items:live().map(strip)},null,1),'application/json','sauvegarde-inventaire-'+day()+'.json');
  };
  $('bi').onchange=function(e){
    var f=e.target.files[0];e.target.value='';if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result),l=d.items||d;if(!Array.isArray(l))throw 0;
        if(confirm(l.length+" références dans ce fichier. Remplacer l'inventaire actuel ?")){restore(l);$('bdlg').close()}
      }catch(x){toast('Fichier de sauvegarde invalide')}
    };
    rd.readAsText(f);
  };
  $('bx').onclick=function(){$('bdlg').close()};

  window.addEventListener('online',function(){status();sync()});
  window.addEventListener('offline',status);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
  setInterval(function(){if(!document.hidden)sync()},15000);

  if(!snaps.length||Date.now()-snaps[0].t>864e5)snap('auto');
  $('ver').textContent='Version '+VERSION;$('hv').textContent='v'+VERSION;
  sv(KEY,items);render();status();sync();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
